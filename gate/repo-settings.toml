# The settings of the GitHub repository that the gate depends on (`docs/gate.md` §6), as code.
# `cargo xtask github check` compares the live repository with this file and with the rulesets
# next to it (`ruleset-main.json`, `ruleset-tags.json`); `cargo xtask github apply` makes the
# repository like them, and is only run after Jann has agreed. `approval` reads the labels from
# here, from the checkout it runs in (the base commit of the pull request, spec D3).

# The merge settings, under the names the GitHub API gives them (`PATCH /repos/{owner}/{repo}`).
# Squash merge only; the squash commit keeps the title of the PR and the messages of its commits,
# so that `Refs:`, `Phase:` and the trailers of Claude reach `main`.
[repo]
allow_squash_merge = true
allow_merge_commit = false
allow_rebase_merge = false
allow_auto_merge = true
delete_branch_on_merge = true
allow_update_branch = true
squash_merge_commit_title = "PR_TITLE"
squash_merge_commit_message = "COMMIT_MESSAGES"

# The labels the gate works with. `color` is six hex digits without `#`, `description` at most
# 100 characters. Other labels of the repository are left alone.

# Added by CI to a pull request that touches a protected path; never removed by CI.
[[labels]]
name = "needs-jann"
color = "d93f0b"
description = "Touches a protected path; waits for Jann"

# Added by Jann after review; the only label that CI removes.
[[labels]]
name = "approved"
color = "0e8a16"
description = "Reviewed by Jann; only Jann adds this label"

# Makes the Windows jobs of `platforms.yml` run on a pull request.
[[labels]]
name = "windows"
color = "1d76db"
description = "Run the Windows jobs of the platforms workflow on this pull request"

# Makes the macOS jobs of `platforms.yml` run on a pull request.
[[labels]]
name = "macos"
color = "5319e7"
description = "Run the macOS jobs of the platforms workflow on this pull request"
