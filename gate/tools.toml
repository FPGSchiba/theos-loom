# The exact versions of the tools the gate runs with. CI installs these, and
# `cargo xtask tools` fails when a local tool differs. Moving a pin is a protected change.
# Node is pinned by its major version, because its minor releases do not change what tsc, ESLint
# or Vitest report; every other tool is pinned exactly.
[tools]
cargo-nextest = "0.9.150"
cargo-deny = "0.20.2"
cargo-llvm-cov = "0.9.1"
gitleaks = "8.30.1"
node = "24"
pnpm = "12.23.0"
