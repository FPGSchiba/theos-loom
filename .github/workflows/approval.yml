# The approval of a pull request that touches a protected path (docs/gate.md section 5).
#
# D3: the job runs the gate of `main`, not the one the pull request brings. It checks out the base
# commit of the pull request (with its history, so the head commits are there as git objects) and
# runs that commit's xtask against the pull request's changes. Only while the base commit has no
# xtask (the pull request that adds the gate) does the job check out the head and run its own.
#
# The token labels and comments on the pull request, which is why this is the one job with write
# scopes. Label and comment changes made with it start no new workflow run.
name: approval

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A run is never cancelled, so that a label change is not cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approval:
    name: approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The credentials stay in the checkout: `cargo xtask approval` fetches the refs of the pull
      # request with `git fetch origin`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('xtask/Cargo.toml') == ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The job runs on pull requests only, so a cache of its own would never be on `main`, where
      # every pull request can restore it. It restores the xtask that `gate` saved on `main` for
      # the key of this checkout (the base commit), builds it on a miss, and saves nothing. The
      # token reaches xtask through the environment of this step.
      - uses: ./.github/actions/xtask
        with:
          args: approval
        env:
          GH_TOKEN: ${{ github.token }}
