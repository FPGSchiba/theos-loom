# The checks of docs/gate.md section 1 that run on every change, as four jobs side by side. Each
# job checks out with the whole history (the changed paths and the commits are read from git), sets
# up what its parts need and runs one `cargo xtask` command, the `command` of its check in
# .loom/checks.toml; xtask decides every verdict, and applies the docs-only rule itself. The job
# name is the required status check of `main` (gate/ruleset-main.json), and `cargo xtask gate` runs
# the same parts locally. Pull request checks run on Linux only.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The push to main fills the caches the next pull requests restore, among them the coverage
  # baseline and the cached xtask.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every part but `test`, `coverage` and `ui`. On `main` it also saves the cached xtask that `ui`,
  # `pr` and `approval` restore.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          parts: fmt,lints,commit-msg,secrets,clippy,docs,deny,ac-trace
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/xtask
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask gate --skip test,coverage,ui

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/loom_test
    # A throwaway PostgreSQL (umbrella T4b), reachable from this job only. `trust` means no
    # password, so nothing here looks like a credential. Nothing uses it yet.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          parts: test
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask gate --only test

  # The baseline of `main` is measured at the merge base, which needs the history, and is cached
  # by commit: a pull request finds the result its base commit stored when it was pushed to main.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOOM_TEST_DATABASE_URL: postgres://postgres@localhost:5432/loom_test
    # A throwaway PostgreSQL (umbrella T4b), reachable from this job only. `trust` means no
    # password, so nothing here looks like a credential. Nothing uses it yet.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          parts: coverage
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/xtask/coverage/cache
          key: coverage-${{ github.event.pull_request.base.sha || github.sha }}-${{ hashFiles('rust-toolchain.toml', 'gate/tools.toml') }}
          restore-keys: coverage-
      - run: cargo xtask gate --only coverage

  # The web app. It builds no Rust of its own: pnpm comes from the `packageManager` of the app, Node
  # from `web/.nvmrc`, and xtask from the cache the `gate` job saved on `main`.
  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: ./.github/actions/xtask
        with:
          args: gate --only ui
