# Windows and macOS are not in the per-pull-request checks (docs/gate.md section 1): CI runs on
# Linux only, and these runners are slower or dearer. This runs the checks that read what the
# compiler builds on the machine, so they can differ per OS: clippy, the tests, the slow tests,
# `lints` and `ac-trace` (the last two read the cfg-selected code that `cargo check` builds). It
# runs every Monday, on demand, and on a pull request that Jann labels `windows` or `macos`, each
# label starting the jobs of its own OS. The jobs are not required status checks. On a pull
# request `slow-tests` decides from the changes since the merge base whether its tests run, as in
# ci.yml, so its jobs fetch the history.
name: platforms

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  clippy-windows:
    name: clippy (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask clippy

  test-windows:
    name: test (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask test

  slow-tests-windows:
    name: slow-tests (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask slow-tests

  lints-windows:
    name: lints (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask lints

  ac-trace-windows:
    name: ac-trace (windows)
    if: github.event_name != 'pull_request' || github.event.label.name == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask ac-trace

  clippy-macos:
    name: clippy (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask clippy

  test-macos:
    name: test (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask test

  test-macos-intel:
    name: test (macos intel)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask test

  slow-tests-macos:
    name: slow-tests (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask slow-tests

  slow-tests-macos-intel:
    name: slow-tests (macos intel)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask slow-tests

  lints-macos:
    name: lints (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask lints

  ac-trace-macos:
    name: ac-trace (macos)
    if: github.event_name != 'pull_request' || github.event.label.name == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo xtask ac-trace
