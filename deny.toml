# cargo-deny configuration (`cargo deny --locked check`). Changing it is a protected change.
# The licence allowlist is the one decided in the P00 spec (section 4.2): nothing else is
# allowed, so no GPL family.

[graph]
# The default features of every crate: what a plain `cargo build` ships.
all-features = false
no-default-features = false

[advisories]
# A yanked release is an error. An advisory ignore needs a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "why it does not apply" }]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
# Our own crates are `publish = false` and have no licence to check.
private = { ignore = true }
# The list is the decided one, not what the tree uses today, so an unused entry is no warning.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `path = "../x"` dependencies between our crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
